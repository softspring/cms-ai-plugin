                empty: "Genera una previsualización para verla aquí a tamaño original."
            actions:
                link: "Generar"
                refresh: "Actualizar"
                preview: "Generar previsualización"
                create: "Crear media"
                cancel: "Cancelar"
        form:
            prompt:
                label: "Generar imagen con IA"
                help: "Describe la imagen que quieres generar. Déjalo vacío para subir un archivo manualmente."
                placeholder: "Ejemplo: Una imagen editorial limpia de un equipo Symfony trabajando en un dashboard de producto, luz natural, estilo realista."
            platform:
                label: "Plataforma IA"
            model:
                label: "Modelo"
            actions:
                generate: "Generar previsualización"
            status:
                generating: "Generando imagen..."
                error: "No se ha podido generar la imagen."

